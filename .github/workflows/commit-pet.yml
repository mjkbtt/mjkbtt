name: Commit Pet

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * *"

permissions:
  contents: write

jobs:
  commit-pet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Checkout Commit Pet generator
        uses: actions/checkout@v4
        with:
          repository: yukurash/commit-pet
          ref: v1
          path: .commit-pet
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate Commit Pet
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node .commit-pet/src/generate.js \
            --user "${{ github.repository_owner }}" \
            --species cat \
            --name Mjuki \
            --theme en \
            --out commit-pet.svg
      - name: Commit and push updated pet
        run: |
          if git diff --quiet commit-pet.svg; then
            echo "No pet changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add commit-pet.svg
          git commit -m "chore: update commit pet"
          git push
